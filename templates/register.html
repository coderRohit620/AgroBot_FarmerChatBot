{% extends "base.html" %}
{% block content %}
<div class="auth-card" style="max-width:540px;">
  <div class="auth-header">
    <div class="auth-icon">🌱</div>
    <h2>Join AgroBot</h2>
    <p class="auth-subtitle">Create your farmer profile to get personalized advice</p>
  </div>

  <form method="post" id="registerForm" novalidate>

    <!-- Row 1: Name + Email -->
    <div style="display:grid; grid-template-columns:1fr 1fr; gap:16px;">
      <div class="form-group">
        <label for="reg-name">👤 Full Name</label>
        <input id="reg-name" name="name" type="text"
               placeholder="Ramesh Kumar"
               autocomplete="name">
      </div>
      <div class="form-group">
        <label for="reg-email">📧 Email Address</label>
        <input id="reg-email" name="email" type="email" required
               placeholder="you@example.com"
               autocomplete="email"
               autocapitalize="none"
               spellcheck="false">
      </div>
    </div>

    <!-- Password -->
    <div class="form-group">
      <label for="reg-password">🔒 Password</label>
      <div style="position:relative;">
        <input id="reg-password" name="password" type="password" required
               placeholder="Choose a strong password"
               autocomplete="new-password"
               style="padding-right:48px;">
        <button type="button" id="toggleRegPwd"
                style="position:absolute;right:14px;top:50%;transform:translateY(-50%);background:none;border:none;cursor:pointer;color:var(--text-muted);font-size:1rem;padding:0;transition:color 0.15s;"
                aria-label="Toggle password visibility">👁</button>
      </div>
      <!-- Password strength indicator -->
      <div id="pwdStrength" style="margin-top:8px;height:3px;border-radius:99px;background:var(--border);overflow:hidden;transition:all 0.3s;">
        <div id="pwdStrengthBar" style="height:100%;width:0%;background:var(--green-500);border-radius:99px;transition:all 0.3s ease;"></div>
      </div>
      <span id="pwdStrengthLabel" style="font-size:0.68rem;color:var(--text-dim);margin-top:4px;display:block;"></span>
    </div>

    <!-- Row 2: Crop + Region -->
    <div style="display:grid; grid-template-columns:1fr 1fr; gap:16px;">
      <div class="form-group">
        <label for="reg-crop">🌾 Primary Crop</label>
        <input id="reg-crop" name="primary_crop" type="text"
               placeholder="e.g. Rice, Wheat, Cotton">
      </div>
      <div class="form-group">
        <label for="reg-region">📍 Region / State</label>
        <input id="reg-region" name="region" type="text"
               placeholder="e.g. Punjab, Maharashtra">
      </div>
    </div>

    <!-- Language -->
    <div class="form-group">
      <label for="reg-lang">🗣️ Preferred Language</label>
      <select id="reg-lang" name="preferred_language">
        <option value="en">🇬🇧 English</option>
        <option value="hi">🇮🇳 Hindi</option>
        <option value="ta">🌴 Tamil</option>
      </select>
    </div>

    <div class="actions" style="margin-top:26px;">
      <button class="btn primary" type="submit" id="registerBtn"
              style="flex:1; justify-content:center; padding:13px; font-size:0.85rem;">
        🌱 Create Account
      </button>
    </div>
  </form>

  <div class="auth-divider">or</div>

  <p style="text-align:center;font-size:0.84rem;color:var(--text-muted);">
    Already have an account?
    <a href="{{ url_for('login') }}"
       style="color:var(--green-400);font-weight:700;margin-left:4px;">
      Login →
    </a>
  </p>
</div>

<script>
  // Toggle password visibility
  const toggleRegBtn = document.getElementById('toggleRegPwd');
  const regPwdInput  = document.getElementById('reg-password');
  if (toggleRegBtn && regPwdInput) {
    toggleRegBtn.addEventListener('click', () => {
      const show = regPwdInput.type === 'password';
      regPwdInput.type = show ? 'text' : 'password';
      toggleRegBtn.textContent = show ? '🙈' : '👁';
    });
  }

  // Password strength meter
  const strengthBar   = document.getElementById('pwdStrengthBar');
  const strengthLabel = document.getElementById('pwdStrengthLabel');
  if (regPwdInput && strengthBar) {
    regPwdInput.addEventListener('input', () => {
      const val = regPwdInput.value;
      let score = 0;
      if (val.length >= 8)  score++;
      if (/[A-Z]/.test(val)) score++;
      if (/[0-9]/.test(val)) score++;
      if (/[^A-Za-z0-9]/.test(val)) score++;

      const pct    = (score / 4) * 100;
      const colors = ['#ef4444', '#f97316', '#eab308', '#22c55e'];
      const labels = ['Weak', 'Fair', 'Good', 'Strong'];

      strengthBar.style.width  = pct + '%';
      strengthBar.style.background = val.length ? colors[score - 1] || colors[0] : 'var(--green-500)';
      strengthLabel.textContent = val.length ? labels[score - 1] || 'Weak' : '';
      strengthLabel.style.color = val.length ? colors[score - 1] || colors[0] : '';
    });
  }

  // Loading state on submit
  const registerForm = document.getElementById('registerForm');
  const registerBtn  = document.getElementById('registerBtn');
  if (registerForm && registerBtn) {
    registerForm.addEventListener('submit', () => {
      registerBtn.disabled = true;
      registerBtn.innerHTML = '<span style="opacity:0.7">Creating account…</span>';
    });
  }
</script>
{% endblock %}
